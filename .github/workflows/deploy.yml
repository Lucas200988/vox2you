name: Deploy to server

# Manual only: pick the branch in the GitHub UI (Actions → Deploy to server → Run workflow).
# The runner checks out the code with GitHub's own credentials and copies it to the server over SSH,
# so the server never needs GitHub access (no deploy key, no token).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      IP or DNS of the server (e.g. 56.125.141.144)
#   DEPLOY_USER      SSH user with passwordless sudo (ubuntu on Lightsail)
#   DEPLOY_SSH_KEY   private key whose public half is in ~/.ssh/authorized_keys of that user
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run the seed after deploy (first deploy only)'
        type: boolean
        default: false
      backup:
        description: 'Take a database backup before updating'
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # The secret is normalised before use, because a key copied from a browser terminal or on
          # Windows arrives with CRLF, surrounding text (prompts, "=== copie daqui ===") or indented
          # base64 — all of which make OpenSSH fail with the opaque "error in libcrypto".
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > /tmp/raw_key
          # keep only the BEGIN..END block, then strip whitespace from the base64 body
          sed -n '/-----BEGIN/,/-----END/p' /tmp/raw_key \
            | awk '/-----/ {sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, ""); print; next}
                   {gsub(/[[:space:]]/, ""); if (length($0)) print}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            # Counts only: printing any part of the key would be masked and is not needed.
            echo "Diagnostico do secret DEPLOY_SSH_KEY (nenhum conteudo e exibido):"
            echo "  linhas recebidas no secret : $(wc -l < /tmp/raw_key)"
            echo "  linhas com -----BEGIN      : $(grep -c -- '-----BEGIN' /tmp/raw_key || true)"
            echo "  linhas com -----END        : $(grep -c -- '-----END' /tmp/raw_key || true)"
            echo "  linhas do bloco extraido   : $(wc -l < ~/.ssh/deploy_key)"
            echo "::error::O secret DEPLOY_SSH_KEY nao contem uma chave privada valida. Ele precisa ter o bloco inteiro, da linha '-----BEGIN ... PRIVATE KEY-----' ate '-----END ... PRIVATE KEY-----' (texto em volta e ignorado automaticamente). Se as contagens de BEGIN/END acima forem 0, a copia nao pegou o bloco; se o bloco tiver poucas linhas, a copia veio truncada. Veja docs/RETOMADA.md secao 2."
            exit 1
          fi
          echo "Chave lida com sucesso: $(ssh-keygen -l -f ~/.ssh/deploy_key | awk '{print $1" bits, "$4}')"
          if ! ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Nao consegui falar com o servidor em DEPLOY_HOST na porta 22. Confira o IP no secret e se a regra de firewall SSH esta aberta no Lightsail."
            exit 1
          fi

      - name: Sync code to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # .env, media, backups and build outputs live only on the server and are never overwritten.
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' --exclude '.next' \
            --exclude 'platform/.env' --exclude 'platform/storage' --exclude 'platform/ops/backup/rclone.conf' \
            --rsync-path='sudo rsync' \
            -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/vox2you/"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SEED: ${{ inputs.seed }}
          BACKUP: ${{ inputs.backup }}
        run: |
          FLAGS=""
          [ "$BACKUP" = "true" ] && FLAGS="$FLAGS --backup"
          [ "$SEED" = "true" ] && FLAGS="$FLAGS --seed"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/vox2you/platform && sudo BUILDKIT_PROGRESS=plain ./ops/deploy.sh $FLAGS"

      - name: Smoke check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/vox2you/platform && sudo bash ops/status.sh"
