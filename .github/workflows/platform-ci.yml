name: platform-ci

on:
  push:
    branches: [master, main]
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-ci.yml']

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vox
          POSTGRES_PASSWORD: vox
          POSTGRES_DB: vox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vox"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://vox:vox@localhost:5432/vox_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-please-change-0123456789abcdef
      APP_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef==
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hash
      MESSAGING_PROVIDER: mock
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --coverage
      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
