name: platform-ci

on:
  push:
    branches: [master, main, 'claude/**']
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-ci.yml']

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vox
          POSTGRES_PASSWORD: vox
          POSTGRES_DB: vox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vox"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://vox:vox@localhost:5432/vox_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-please-change-0123456789abcdef
      APP_ENCRYPTION_KEY: ci-only-encryption-key-0123456789abcdef==
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hash
      MESSAGING_PROVIDER: mock
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --coverage
      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  # Builds the production images exactly as the server does. Catches files missing from the
  # repository (gitignore mistakes, untracked directories) that local checks cannot see.
  docker-images:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: platform
          file: platform/apps/${{ matrix.image }}/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
