global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: vox-api
    metrics_path: /metrics
    # If METRICS_TOKEN is set in .env, add:  authorization: { credentials: "<token>" }
    static_configs:
      - targets: ["api:4000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
