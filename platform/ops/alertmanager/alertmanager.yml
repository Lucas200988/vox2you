# Edit the receiver below (e-mail via SMTP, or swap for slack_configs / webhook_configs).
global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alertas@vox2you.com.br"
  smtp_auth_username: "alertas@vox2you.com.br"
  smtp_auth_password: "CHANGE-ME"
  smtp_require_tls: true

route:
  receiver: ops-email
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ["severity=critical"]
      receiver: ops-email
      repeat_interval: 1h

receivers:
  - name: ops-email
    email_configs:
      - to: "ti@vox2you.com.br"
        send_resolved: true
