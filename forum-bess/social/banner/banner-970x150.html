<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00B84E;--gl:#00D060;--am:#FFC107}
body{background:#222;font-family:Montserrat,'Segoe UI',Arial,sans-serif;color:#fff}
.bn{width:970px;height:150px;position:relative;overflow:hidden;display:flex;align-items:center;
 background:radial-gradient(circle at 10% 50%,rgba(0,208,96,.26),transparent 42%),
            radial-gradient(circle at 80% 130%,rgba(255,193,7,.13),transparent 44%),
            linear-gradient(100deg,#0A3252,#082A43 52%,#04182A)}
.grid{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:34px 34px}
.lb{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--g),var(--gl),var(--am))}
.brand{position:relative;z-index:2;flex-shrink:0;padding:0 13px 0 19px;display:flex;align-items:center;gap:9px;border-right:1px solid rgba(255,255,255,.16)}
.bolt{font-size:29px;line-height:1}
.bt .t1{font-size:29px;font-weight:900;letter-spacing:-1px;line-height:.9}
.bt .t2{font-size:16px;font-weight:900;letter-spacing:3px;color:var(--gl);line-height:1;margin-top:2px}
.mid{position:relative;z-index:2;flex:1;padding:0 14px;min-width:0}
.mid .h{font-size:15px;font-weight:800;line-height:1.3;letter-spacing:-.2px;white-space:nowrap}
.mid .h em{font-style:normal;color:var(--gl)}
.mid .d{margin-top:8px;display:flex;align-items:center;gap:7px}
.mid .pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:4px 9px;font-size:10.5px;font-weight:800;white-space:nowrap}
.mid .pill b{color:var(--gl)}
.cta{position:relative;z-index:2;flex-shrink:0;padding:0 12px}
.cta .btn{background:linear-gradient(135deg,var(--g),var(--gl));color:#04301A;font-size:13px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;padding:11px 16px;border-radius:9px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,208,96,.34);text-align:center}
.cta .site{margin-top:5px;font-size:9.5px;font-weight:800;color:rgba(255,255,255,.62);text-align:center}
.inst{position:relative;z-index:2;flex-shrink:0;height:100%;padding:0 14px 0 12px;background:rgba(255,255,255,.055);border-left:1px solid rgba(255,255,255,.16);display:flex;align-items:center;gap:11px}
.col{display:flex;flex-direction:column;align-items:center;gap:5px}
.col .lbl{font-size:7px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.55);white-space:nowrap}
.chip{background:#fff;border-radius:6px;padding:4px 7px;display:flex;align-items:center}
.chip img{height:24px;width:auto;object-fit:contain;display:block}
.selo{height:62px;width:auto;object-fit:contain;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
</style></head><body>
